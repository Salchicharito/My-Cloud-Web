spring.application.name=escuela-rest

# 8081 para no chocar con el Tomcat de la app JSP (8080)
server.port=8081

# Base de datos ESCUELA (la misma que usa hibernate.cfg.xml)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ESCUELA
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}

# Las tablas ya existen (sql/Escuela.sql): Hibernate no debe crearlas ni modificarlas
spring.jpa.hibernate.ddl-auto=none
# Respeta los nombres en MAYÚSCULAS de @Table/@Column (MySQL en Linux distingue mayúsculas)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
